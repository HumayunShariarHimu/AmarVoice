<style>
/* ═══════════════════════════════════════════════
   Beautiful Error State — play.html override
   (Supplements css/style.css without touching it)
   ═══════════════════════════════════════════════ */

/* Outer container for the animated icon */
.error-visual {
  position: relative;
  width: 96px;
  height: 96px;
  margin: 0 auto 26px;
}

/* Concentric pulsing rings */
.error-rings {
  position: absolute;
  inset: 0;
}
.error-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 77, 109, 0.38);
  animation: errRingPulse 2.7s ease-out infinite;
}
.error-ring-2 { animation-delay: 0.9s; }
.error-ring-3 { animation-delay: 1.8s; }
@keyframes errRingPulse {
  0%   { transform: scale(0.55); opacity: 1; }
  100% { transform: scale(1.8);  opacity: 0; }
}

/* Icon circle core */
.error-icon-core {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 66px; height: 66px;
  border-radius: 50%;
  background: rgba(255, 77, 109, 0.10);
  border: 1.5px solid rgba(255, 77, 109, 0.48);
  color: #ff4d6d;
  display: grid;
  place-items: center;
  box-shadow: 0 0 32px rgba(255, 77, 109, 0.15),
              inset 0 0 16px rgba(255, 77, 109, 0.05);
}

/* Title & message */
.error-headline {
  font-family: var(--font-display);
  font-size: 1.2rem;
  font-weight: 700;
  color: #f3f3f8;
  margin-bottom: 10px;
  letter-spacing: 0.01em;
}
#errorMsg {
  color: #a9a9c0 !important;
  font-size: 0.88rem;
  line-height: 1.7;
  margin-bottom: 0 !important;
}

/* Flat / silent waveform — visual metaphor for deleted audio */
.error-dead-wave {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 5px;
  height: 38px;
  margin: 22px auto 28px;
  opacity: 0.18;
}
.error-dead-wave span {
  display: block;
  width: 4px;
  border-radius: 4px;
  background: #ff4d6d;
  flex-shrink: 0;
}

/* Home button */
.btn-go-home {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 13px 30px;
  border-radius: 999px;
  background: linear-gradient(
    135deg,
    rgba(255, 77, 109, 0.13) 0%,
    rgba(157, 77, 255, 0.13) 100%
  );
  border: 1.5px solid rgba(255, 77, 109, 0.48);
  color: #f3f3f8;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.95rem;
  text-decoration: none;
  cursor: pointer;
  margin-bottom: 18px;
  transition:
    transform   0.2s cubic-bezier(0.22, 1, 0.36, 1),
    box-shadow  0.2s cubic-bezier(0.22, 1, 0.36, 1),
    background  0.2s cubic-bezier(0.22, 1, 0.36, 1),
    border-color 0.2s cubic-bezier(0.22, 1, 0.36, 1);
}
.btn-go-home:hover {
  transform: translateY(-3px);
  background: linear-gradient(
    135deg,
    rgba(255, 77, 109, 0.26) 0%,
    rgba(157, 77, 255, 0.24) 100%
  );
  border-color: rgba(255, 77, 109, 0.75);
  box-shadow: 0 10px 34px rgba(255, 77, 109, 0.24);
}
.btn-go-home:active { transform: scale(0.97); }

/* Sub-note below the button */
.error-sub-note {
  font-size: 0.78rem;
  color: #6f6f88;
  line-height: 1.5;
}
</style>

    <div class="error-visual">

          <line x1="8.5" y1="21" x2="15.5" y2="21"/>

    </p>

  <div id="playerState" class="state-card glass hidden">

        <svg class="icon-pause" viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>

    <audio id="audioEl" preload="metadata" class="visually-hidden"></audio>

      শেয়ার করুন

    <a href="index.html" class="cta-link">আপনিও ভয়েস কমেন্ট তৈরি করুন →</a>
  </div>

<script>
/* Entrance animation for error state:
   player.js calls classList.remove('hidden') — we catch that
   via MutationObserver and add the same anim-in used elsewhere. */
(function () {
  var el = document.getElementById('errorState');
  if (!el) return;
  new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      if (m.attributeName === 'class' && !el.classList.contains('hidden')) {
        el.classList.add('anim-in');
      }
    });
  }).observe(el, { attributes: true });
}());
</script>
